<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Images et figures HTML</title>
</head>
<body>
    <h1>Images et figures HTML</h1>
    <p>Une image permet d'afficher un contenu visuel dans une page HTML.</p>
    <img src="img/author.avif" alt="Portrait d'un développeur" width="200" height="220">
    <figure>
        <img src="img/author2.jpg" alt="Image d'un développeur" width="220" height="220">
        <figcaption>Le développeur écrit le code de l'application.</figcaption>
    </figure>
</body>
